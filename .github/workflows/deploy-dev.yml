name: Deploy frontend/client site to Github Pages for development environment

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline.yml
    with:
      environment: github-pages
